# LS210D SPI フラッシュ (MX25L8005, 1MiB) 用モジュールの明示ロード設定。
# /etc/modules-load.d/ls210d-spi-nor.conf にコピーする。
#
# DT には spi-flash ノード (compatible = "mx25l8005", "jedec,spi-nor") があるが、
# spi デバイスの modalias (spi:mx25l8005) が spi-nor のモジュールエイリアスと
# 一致しないため udev の自動ロードが効かず、/dev/mtd* が出現しない。
# ここで明示的にロードすれば spi-nor が OF マッチでバインドされ、
# DT のパーティション通り /dev/mtd0 (u-boot) と /dev/mtd1 (u-boot-env) が出る。
spi-nor
mtdblock
